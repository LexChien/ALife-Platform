<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALife Prototype | ASAL + Gemma</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel">
        <div class="visual-container">
          <div class="avatar-stage" id="avatarStage" data-emotion="neutral">
            <!-- Plan 38 J0.3: emotion colour lives on this halo, never on the face (identity lock) -->
            <div class="avatar-halo" id="avatarHalo" aria-hidden="true"></div>
            <div class="avatar-wrap" id="avatarWrap" data-state="idle">
              <div class="noir-viewport">
                <!-- Plan 38 J0.4: the fixed avatar is the top visual layer of the viewport; ASAL moved to LIFE CORE -->
                <img id="avatarFace" class="avatar-face" src="/avatar.jpg" alt="DigiClone avatar" draggable="false">
                <!-- Plan 38 J3: lip-sync layer = same geometry, offline mouth keyframes of the SAME fixed avatar (guard-checked) -->
                <img id="avatarMouth" class="avatar-face avatar-mouth" src="/avatar.jpg" alt="" aria-hidden="true" draggable="false" data-face-overlay="identity-guarded">
                <div class="sunlight-bars"></div>
                <div class="interaction-lens"></div>
              </div>
              <div class="noir-label">SYSTEM READY</div>
            </div>
          </div>

          <div class="user-video-wrap" id="userVideoWrap">
            <video id="userVideo" autoplay playsinline muted></video>
            <div class="video-overlay">LOCAL FEED</div>
            <div class="video-controls">
              <button id="cameraToggle" class="icon-button">📷</button>
            </div>
          </div>
        </div>

        <h1 class="noir-title">ALIFE PROTOTYPE</h1>
        <p class="noir-subtitle">ASAL + DIGITAL CLONE + GEMMA VOICE</p>

        <div class="status-grid">
          <div class="status-card">
            <span class="label">ENGINE</span>
            <span class="value mono" id="backendStatus">ONLINE</span>
          </div>
          <div class="status-card">
            <span class="label">STATE</span>
            <span class="value mono" id="avatarStatus">IDLE</span>
          </div>
          <div class="status-card">
            <span class="label">EMOTION</span>
            <span class="value mono" id="emotionStatus">--</span>
          </div>
          <div class="status-card">
            <span class="label">DNA</span>
            <span class="value mono" id="dnaStatus">--</span>
          </div>
        </div>

        <!-- Plan 38 J4.4: JARVIS-style HUD -->
        <section class="hud-panel" aria-label="DigiClone HUD">
          <div class="hud-head">
            <span class="label">DIGICLONE HUD</span>
            <span class="value mono" id="hudState">IDLE</span>
          </div>
          <div class="hud-controls">
            <button type="button" class="mic-button" id="rtConnect">LIVE VOICE</button>
            <select id="rtMode" aria-label="Listening mode">
              <option value="open">OPEN MIC</option>
              <option value="wake">WAKE WORD (Hey Jarvis / 你好管家)</option>
              <option value="ptt">PUSH-TO-TALK</option>
            </select>
            <button type="button" class="mic-button" id="rtPtt" title="Hold (or hold Space) to talk">HOLD TO TALK</button>
          </div>
          <div class="hud-status mono" id="rtStatus">OFFLINE</div>
          <div class="hud-transcript" id="rtTranscript"></div>
          <div class="hud-trace mono" id="hudTrace"></div>
          <div class="hud-mood" id="hudMood"></div>
          <label class="toggle"><input type="checkbox" id="thoughtToggle"> THOUGHT STREAM (private)</label>
          <ol class="hud-thoughts" id="hudThoughts" hidden></ol>
        </section>

        <section class="life-panel" aria-label="Artificial life progress">
          <div class="life-panel-head">
            <span class="label">LIFE CORE</span>
            <span class="value mono" id="lifeRunStatus">LOADING</span>
          </div>
          <div class="life-visual-box">
            <img id="lifeVisual" class="life-visual" alt="ASAL artificial-life organism" hidden>
            <div id="lifeFallback" class="life-fallback">ASAL</div>
          </div>
          <p id="lifeSummary" class="life-summary">讀取 ASAL 進度中</p>
          <div class="life-metrics">
            <span id="lifeScore">score --</span>
            <span id="lifePhase">phase --</span>
          </div>
          <div id="lifePhases" class="life-phases"></div>
          <div class="life-detail-grid">
            <div>
              <span class="label">RECENT RUNS</span>
              <div id="lifeRuns" class="life-runs"></div>
            </div>
            <div>
              <span class="label">OPEN ITEMS</span>
              <div id="lifeTasks" class="life-tasks"></div>
            </div>
          </div>
          <div id="lifeMilestones" class="life-milestones"></div>
        </section>
      </section>

      <section class="chat-panel">
        <div style="width: 100%; height: 280px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
            <source src="/generated_video-3.mp4" type="video/mp4">
          </video>
        </div>

        <div class="chat-log" id="chatLog"></div>
        <div class="quick-actions" aria-label="Suggested prompts">
          <button type="button" class="quick-button" data-prompt="請用三句話說明目前人工生命雛形的 ASAL 進度、限制與下一步。">STATUS</button>
          <button type="button" class="quick-button" data-prompt="請根據 birth split fusion 三個 phase，解釋目前這個 ASAL 生命體看起來完成了什麼。">PHASES</button>
          <button type="button" class="quick-button" data-prompt="目前這個人工生命雛形還不能誇稱完成的地方有哪些？">LIMITS</button>
        </div>

        <form class="composer" id="composerForm">
          <textarea id="messageInput" placeholder="Enter message..." spellcheck="false"></textarea>
          <div class="composer-actions">
            <div class="toggles">
              <label class="toggle"><input type="checkbox" id="speakToggle" checked> VOICE</label>
              <label class="toggle"><input type="checkbox" id="submitToggle" checked> AUTO</label>
            </div>
            <div class="buttons">
              <button type="button" class="mic-button" id="micButton">MICROPHONE</button>
              <button type="submit" class="send-button" id="sendButton">SEND</button>
            </div>
          </div>
          <div class="mic-hint" id="micHint">READY</div>
        </form>
      </section>
    </main>

    <template id="messageTemplate">
      <article class="message-row">
        <div class="message-bubble"></div>
      </article>
    </template>

    <script src="/app.js"></script>
    <script src="/avatar.js"></script>
    <script src="/hud.js"></script>
    <script src="/realtime.js"></script>
  </body>
</html>
