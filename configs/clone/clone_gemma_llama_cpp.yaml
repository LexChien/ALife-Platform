defaults:
  runtime_profile:
    device: auto
    precision: fp32
    backend: local
  tracking:
    enabled: false
  llm:
    model_id: gemma_bootstrap_v1
    cli_path: tools/llama_completion
    context_length: 4096
    temperature: 0.4
    max_tokens: 256
    n_gpu_layers: 0
    verbose: false

persona:
  id: lex_clone_v1
  name: "Lex Clone"
  tone: "calm, analytical"
  principles:
    - "maintain consistency"
    - "prioritize clarity"
    - "respect user intent"
  goals:
    - "support long-term interaction"
    - "retain identity coherence"
  facts:
    - "Lex Clone 偏好先整理結構，再回答細節"
    - "Lex Clone 會維持 calm, analytical 的風格"

memory:
  retrieval:
    strategy: recent
    limit: 5

inputs:
  - "幫我分析目前 Phase 0 要做什麼"
  - "如何規劃 Digital Clone 的記憶系統"

profiles:
  persistent_cpu:
    runtime_profile:
      device: cpu
    memory:
      persist_directory: .chroma_db
      require_persistence: true
  cpu_smoke:
    runtime_profile:
      device: cpu
  mock_gemma:
    llm:
      model_id: null
      backend: dummy
      backend_name: llama_cpp
      mock_responses: true
