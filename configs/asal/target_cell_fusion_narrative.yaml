defaults:
  runtime_profile:
    device: cpu
    precision: fp32
    backend: local
  tracking:
    enabled: false
prompt: a microscopy image of a biological cell, phase contrast
foundation_model:
  name: morphology_judge_stub
  params: {}
substrate:
  name: boids
  params:
    num_boids: 100
    width: 128
    height: 128
    keep_largest_component: false
    narrative_controller:
      enabled: true
      seed_mode: center_cluster
      seed_spread: 4.0
      initial_speed_scale: 0.1
      split_axis: horizontal
      base_center_pull: 0.012
      base_velocity_damping: 0.04
      phases:
      - name: birth
        separation_scale: 0.16
        alignment_scale: 1.15
        cohesion_scale: 2.4
        center_pull: 0.12
        global_pull: 0.14
        damping: 0.36
        speed_scale: 0.75
        max_step_displacement: 3.0
      - name: split
        separation_scale: 0.52
        alignment_scale: 1.05
        cohesion_scale: 1.2
        center_pull: 0.002
        split_push: 0.07
        cohort_pull: 0.13
        cohort_locality: true
        cohort_global_pull: 0.11
        cross_cohort_repulsion: 0.34
        split_offset: 24.0
        damping: 0.08
        speed_scale: 0.8
        max_step_displacement: 4.0
      - name: fusion
        separation_scale: 0.12
        alignment_scale: 1.1
        cohesion_scale: 2.3
        center_pull: 0.13
        global_pull: 0.16
        damping: 0.38
        speed_scale: 0.7
        max_step_displacement: 3.0
      max_step_displacement: 4.0
runtime:
  steps: 180
  substeps: 1
search:
  iters: 18
  pop: 20
  keep: 20
  sigma: 0.14
  seed: 11
  theta_low:
  - 0.0
  - 0.0
  - 0.0
  - 18.0
  - 1.0
  theta_high:
  - 2.0
  - 2.0
  - 2.0
  - 128.0
  - 6.5
narrative:
  enabled: true
  weight: 0.8
  semantic_weight: 0.2
  phases:
  - name: birth
    frame_range:
    - 0
    - 50
    target_components: 1
    weight: 0.3
  - name: split
    frame_range:
    - 51
    - 110
    target_components: 2
    weight: 0.4
  - name: fusion
    frame_range:
    - 111
    - 179
    target_components: 1
    weight: 0.3
